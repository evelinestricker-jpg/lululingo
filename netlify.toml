# Netlify lægger mappen "app" online. Der er intet byggetrin – filerne er klar som de er.
[build]
  publish = "app"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
